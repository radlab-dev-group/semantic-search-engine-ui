{# Renders rows: list[dict] as a modern, scrollable HTML table #}
{% if rows %}
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        {% for col in rows[0].keys() %}
          <th>{{ col }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
        <tr>
          {% for val in row.values() %}
            <td>{{ val }}</td>
          {% endfor %}
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endif %}
